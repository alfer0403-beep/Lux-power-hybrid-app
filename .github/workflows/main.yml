name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract the replacement project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=""
          if [[ -f "LuxMonitor-github.zip" ]]; then
            ZIP_FILE="LuxMonitor-github.zip"
          elif [[ -f "LuxMonitor-github-patched.zip" ]]; then
            ZIP_FILE="LuxMonitor-github-patched.zip"
          fi

          if [[ -n "$ZIP_FILE" ]]; then
            echo "Using project source from $ZIP_FILE"
            EXTRACT_DIR="$RUNNER_TEMP/luxmonitor-project"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q -o "$ZIP_FILE" -d "$EXTRACT_DIR"
            PROJECT_DIR="$(find "$EXTRACT_DIR" -type f -name settings.gradle.kts -printf '%h\n' -quit)"
            if [[ -z "$PROJECT_DIR" ]]; then
              echo "ERROR: No settings.gradle.kts found inside $ZIP_FILE"
              exit 1
            fi
            cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"
          else
            echo "No replacement ZIP found; using checked-out project files."
          fi

          if [[ ! -f settings.gradle.kts ]]; then
            echo "ERROR: Gradle project root not found. Expected settings.gradle.kts at repository root after extraction."
            echo "Upload the project archive as LuxMonitor-github.zip."
            exit 1
          fi
          echo "Project root: $GITHUB_WORKSPACE"
          echo "MainActivity source: $(find app/src/main/java -name MainActivity.kt -print -quit)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing key
        shell: bash
        run: |
          set -euo pipefail
          test -f app/fixed.keystore.b64
          base64 -d app/fixed.keystore.b64 > app/fixed.keystore

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuxMonitor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
