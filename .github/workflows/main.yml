              if(addDay>0) Bullet("Batteries: +$addDay x Pytes V5 (5.12 kWh each) gives about ${fm(cap+addDay*5.12)} kWh, enough for a full day without sun. Night only needs +$addNight. Allow rack space for them; each V5 module supports up to 16 per group.")
              else Bullet("Battery size is enough for a full day without sun.")
              if(extraKwp>0.05) Bullet("Solar: about +${fm(extraKwp,1)} kWp (roughly ${Math.ceil(extraKwp/0.45).toInt()} panels of 450 W) to cover your use on a low-sun day. Your array is about ${fm(kwpEst,1)} kWp and the inverter accepts up to 18 kW, so there is ${fm(maxOf(0.0,18-kwpEst),1)} kW of headroom.")
              else Bullet("Solar covers your average use on a low-sun day.")
              if(peakKw>invKw*0.8) Bullet("Inverter: recorded peak ${fm(peakKw,1)} kW is close to the 11.5 kW limit. Add a second inverter in parallel (up to 10 are supported) or put big loads on the smart-load output.")
              else Bullet("Inverter size is fine for the recorded peak of ${fm(peakKw,1)} kW. Short motor-start spikes may be higher than the history shows.")
              if(x.bmsDisA>0&&bmsKw<peakKw) Bullet("The batteries currently allow only ${fm(bmsKw,1)} kW of discharge. Each extra V5 module adds about 3.8 kW.")
              Bullet("Generator: the inverter has a dedicated generator input. A 5 to 8 kW generator is the usual safety net for several days of bad weather.")
              Bullet("Backup circuits: every circuit you need must be on the backup (UPS) output, rated 11.5 kW. Check your utility's rules before disconnecting fully.")

