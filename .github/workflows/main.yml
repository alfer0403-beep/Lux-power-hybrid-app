                    val ld=LocalDate.now(); val hourNow=java.time.LocalTime.now().hour
                    val rI=sp.getString("ri","0.25")!!.toDoubleOrNull()?:0.0; val rE=sp.getString("re","0.10")!!.toDoubleOrNull()?:0.0
                    if(sp.getString("ws","1")=="1"&&ld.dayOfWeek==java.time.DayOfWeek.SUNDAY&&hourNow>=18&&sp.getString("ws_last","")!=ld.toString()){
                      sp.edit().putString("ws_last",ld.toString()).apply()
