              OutlinedButton({ if(host.isBlank()||dl.isBlank()||sn.isBlank()) ogMsg="Needs the local dongle details in Settings."
                else scope.launch(Dispatchers.IO){ ogMsg=try{
                  val low=LuxClient.readHold(host,dl,sn,125); val eod=LuxClient.readHold(host,dl,sn,105); val ac=LuxClient.readHold(host,dl,sn,67)
