name: Build Lux Monitor APK
# Single-file setup: this workflow writes the whole Android project, builds it, and publishes the APK.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project files
        run: |
          mkdir proj
          cd proj
          mkdir -p app
          mkdir -p app/src/main
          mkdir -p app/src/main/java/com/lux/monitor
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          cat > app/build.gradle.kts <<'EOF'
          plugins{id("com.android.application");id("org.jetbrains.kotlin.android")}
          android{namespace="com.lux.monitor";compileSdk=34
          defaultConfig{applicationId="com.lux.monitor";minSdk=26;targetSdk=34;versionCode=1;versionName="1.0"}
          buildFeatures{compose=true}
          composeOptions{kotlinCompilerExtensionVersion="1.5.14"}
          compileOptions{sourceCompatibility=JavaVersion.VERSION_17;targetCompatibility=JavaVersion.VERSION_17}
          kotlinOptions{jvmTarget="17"}
          signingConfigs{create("fixed"){storeFile=file("fixed.keystore");storePassword="android";keyAlias="luxmonitor";keyPassword="android"}}
          buildTypes{getByName("debug"){signingConfig=signingConfigs.getByName("fixed")}}}
          dependencies{implementation(platform("androidx.compose:compose-bom:2024.06.00"))
          implementation("androidx.compose.material3:material3");implementation("androidx.compose.ui:ui")
          implementation("androidx.activity:activity-compose:1.9.0")
          implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2")}
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.WAKE_LOCK"/>
          <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
          <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
          <application android:label="Lux Monitor" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@android:style/Theme.Material.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"><intent-filter>
          <action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/>
          </intent-filter></activity><service android:name=".MonitorService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Local inverter monitoring"/></service>
          <receiver android:name=".LuxWidget" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info"/></receiver>
          <receiver android:name=".LuxFlowWidget" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_flow_info"/></receiver>
          <receiver android:name=".BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver>
          </application></manifest>
          EOF
          cat > app/src/main/java/com/lux/monitor/Appliances.kt <<'EOF'
          package com.lux.monitor
          import android.content.Context
          import android.content.SharedPreferences
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.time.Instant
          import java.time.LocalDate
          import java.time.ZoneId

          /** Switch-on events found from jumps in the load. A big jump that later drops by the same amount is one event,
           *  and loads that start or stop together are split by matching combinations. */
          fun edgeEvents(thr:Double,maxMin:Int):List<Ev>{
            val pts=History.pts.toList().sortedBy{it.t}
            if(pts.size<120) return emptyList()
            val n=pts.size; val l=pts.map{ it.load.toDouble() }
            class Edge(val t:Long,var d:Double)
            val edges=ArrayList<Edge>(); var i=1
            while(i<n){
              if(pts[i].t-pts[i-1].t>3*60000L){ i++; continue }
              val d=l[i]-l[i-1]
              if(Math.abs(d)>=thr*0.5){
                var s=d; var j=i
                while(j+1<n&&j-i<2&&(l[j+1]-l[j])*d>0&&Math.abs(l[j+1]-l[j])>=thr*0.25&&pts[j+1].t-pts[j].t<=3*60000L){ j++; s+=l[j]-l[j-1] }
                if(Math.abs(s)>=thr) edges.add(Edge(pts[i].t,s))
                i=j+1
              } else i++
            }
            val maxMs=maxMin*60000L
            val open=ArrayList<Edge>(); val out=ArrayList<Ev>()
            fun close(o:Edge,t:Long,m:Double){ val mins=((t-o.t)/60000).toInt(); if(mins>=2) out.add(Ev(o.t,m,mins,m*mins/60.0/1000.0)) }
            for(e in edges){
              open.removeAll{ e.t-it.t>maxMs }
              if(e.d>0){ open.add(Edge(e.t,e.d)); continue }
              val m=-e.d
              val one=open.filter{ Math.abs(it.d-m)<=maxOf(0.25*it.d,150.0) }.minByOrNull{ Math.abs(it.d-m) }
              if(one!=null){ open.remove(one); close(one,e.t,one.d); continue }
              val recent=open.takeLast(8); var best:List<Edge>?=null; var be=1e18
              for(a in recent.indices) for(b in a+1 until recent.size){
                val e2=Math.abs(recent[a].d+recent[b].d-m)
                if(e2<=maxOf(0.12*m,150.0)&&e2<be){ be=e2; best=listOf(recent[a],recent[b]) }
                for(c in b+1 until recent.size){
                  val e3=Math.abs(recent[a].d+recent[b].d+recent[c].d-m)
                  if(e3<=maxOf(0.12*m,150.0)&&e3<be){ be=e3; best=listOf(recent[a],recent[b],recent[c]) } } }
              val bb=best
              if(bb!=null){ bb.forEach{ open.remove(it); close(it,e.t,it.d) }; continue }
              val big=open.filter{ it.d>=m*0.95 }.minByOrNull{ it.d-m }
              if(big!=null){ close(big,e.t,m); big.d-=m; if(big.d<thr*0.5) open.remove(big) }
            }
            return out
          }

          class LoggedEv(val t:Long,val w:Double,val min:Int,val kwh:Double)

          /** Events kept for a year so patterns and monthly totals survive the 7-day history window. */
          object EventLog{
            private var file:File?=null
            val ev=ArrayList<LoggedEv>()
            @Synchronized fun init(ctx:Context){
              if(file!=null) return
              val f=File(ctx.filesDir,"events2.csv"); file=f
              if(f.exists()) f.forEachLine{ l-> val p=l.split(","); if(p.size==4) ev.add(LoggedEv(p[0].toLong(),p[1].toDouble(),p[2].toInt(),p[3].toDouble())) }
            }
            @Synchronized fun scan(ctx:Context){
              init(ctx)
              val thr=maxOf(150.0,ctx.getSharedPreferences("c",0).getString("spikeW","400")!!.toDoubleOrNull()?:400.0)
              var changed=false
              for(e in edgeEvents(thr,840)){
                if(ev.any{ Math.abs(it.t-e.t)<=2*60000L&&Math.abs(it.w-e.watts)<=0.2*it.w }) continue
                ev.add(LoggedEv(e.t,e.watts,e.minutes,e.kwh)); changed=true }
              val cut=System.currentTimeMillis()-400*86400000L
              if(ev.removeAll{ it.t<cut }) changed=true
              if(changed) file!!.writeText(ev.joinToString(""){ "${it.t},${it.w},${it.min},${it.kwh}\n" })
            }
          }

          /** A switch-on that happens at about the same time of day, with about the same size, on several different days. */
          class Cluster{
            var sn=0.0; var cs=0.0; var wSum=0.0; var n=0; val dates=HashSet<LocalDate>(); var minSum=0.0; var kwhSum=0.0
            val timeMin:Int get(){ var a=Math.atan2(sn,cs); if(a<0) a+=2*Math.PI; return ((a/(2*Math.PI)*1440).toInt())%1440 }
            val watts:Double get()=wSum/n
          }
          fun spikeClusters():List<Cluster>{
            val z=ZoneId.systemDefault(); val cut=System.currentTimeMillis()-30*86400000L
            val cl=ArrayList<Cluster>()
            for(e in EventLog.ev.filter{ it.t>=cut }.sortedBy{ it.t }){
              val ldt=Instant.ofEpochMilli(e.t).atZone(z).toLocalDateTime(); val tm=ldt.hour*60+ldt.minute; val ang=tm/1440.0*2*Math.PI
              var best=cl.firstOrNull{ k-> var dt=Math.abs(k.timeMin-tm); dt=minOf(dt,1440-dt); dt<=25&&Math.abs(k.watts-e.w)<=maxOf(150.0,0.12*k.watts) }
              if(best==null){ best=Cluster(); cl.add(best) }
              best.sn+=Math.sin(ang); best.cs+=Math.cos(ang); best.wSum+=e.w; best.n++; best.dates.add(ldt.toLocalDate()); best.minSum+=e.min; best.kwhSum+=e.kwh
            }
            return cl.filter{ it.n>=3&&it.dates.size>=3 }.sortedBy{ it.timeMin }
          }

          class Assign(val t:Int,val w:Double,val name:String)
          /** Names you give to repeated spikes (matched by time of day and size, so they survive small drifts). */
          object Spk{
            fun load(sp:SharedPreferences):List<Assign>{
              val a=runCatching{ JSONArray(sp.getString("spkAssign","[]")) }.getOrNull()?:return emptyList()
              return (0 until a.length()).map{ val o=a.getJSONObject(it); Assign(o.getInt("t"),o.getDouble("w"),o.getString("n")) }
            }
            private fun save(sp:SharedPreferences,l:List<Assign>){
              val a=JSONArray(); l.forEach{ a.put(JSONObject().put("t",it.t).put("w",it.w).put("n",it.name)) }
              sp.edit().putString("spkAssign",a.toString()).apply()
            }
            private fun dist(a:Assign,c:Cluster):Double{ var dt=Math.abs(a.t-c.timeMin); dt=minOf(dt,1440-dt); return dt+Math.abs(a.w-c.watts)/50.0 }
            private fun near(a:Assign,c:Cluster):Boolean{ var dt=Math.abs(a.t-c.timeMin); dt=minOf(dt,1440-dt); return dt<=45&&Math.abs(a.w-c.watts)<=maxOf(200.0,0.2*a.w) }
            fun nameFor(sp:SharedPreferences,c:Cluster):String?=load(sp).filter{ near(it,c) }.minByOrNull{ dist(it,c) }?.name
            fun assign(sp:SharedPreferences,c:Cluster,name:String){
              val l=load(sp).filterNot{ near(it,c) }.toMutableList()
              if(name.isNotBlank()) l.add(Assign(c.timeMin,c.watts,name.trim()))
              save(sp,l)
            }
          }

          class Item(val name:String,val w:Double,val manualH:Double)
          /** Items you add by hand (for loads too small or too steady to show up as spikes, like Christmas lights). */
          object Appl{
            fun load(sp:SharedPreferences):List<Item>{
              val a=runCatching{ JSONArray(sp.getString("appl","[]")) }.getOrNull()?:return emptyList()
              return (0 until a.length()).map{ val o=a.getJSONObject(it); Item(o.getString("n"),o.getDouble("w"),o.optDouble("m",0.0)) }.filter{ it.manualH>0 }
            }
            fun save(sp:SharedPreferences,l:List<Item>){
              val a=JSONArray(); l.forEach{ a.put(JSONObject().put("n",it.name).put("w",it.w).put("m",it.manualH)) }
              sp.edit().putString("appl",a.toString()).apply()
            }
          }

          fun fmtClock(min:Int):String=java.time.LocalTime.of(min/60,min%60).format(java.time.format.DateTimeFormatter.ofPattern("h:mm a"))

          /** Approximate kWh per name over 30 days, scaled up when fewer days have been recorded. */
          fun monthlyBreakdown(sp:SharedPreferences):Triple<List<Pair<String,Double>>,Double?,Int>{
            val now=System.currentTimeMillis(); val from=now-30*86400000L
            val first=Daily.days.keys.minOrNull()?.let{ LocalDate.parse(it) }
            val cov=maxOf(1,minOf(30,if(first==null) 1 else (java.time.temporal.ChronoUnit.DAYS.between(first,LocalDate.now())+1).toInt()))
            val scale=30.0/cov
            val byName=HashMap<String,Double>(); var clustered=0.0
            for(c in spikeClusters()){ val nm=Spk.nameFor(sp,c)?:"Not named yet"; byName[nm]=(byName[nm]?:0.0)+c.kwhSum*scale; clustered+=c.kwhSum*scale }
            val out=ArrayList<Pair<String,Double>>()
            byName.forEach{ (k,v)-> if(v>0.01) out.add(Pair(k,v)) }
            val other=EventLog.ev.filter{ it.t>=from }.sumOf{it.kwh}*scale-clustered
            if(other>0.05) out.add(Pair("Other spikes (not repeating)",other))
            Appl.load(sp).forEach{ out.add(Pair(it.name+" (by hand)",it.w*it.manualH*30/1000.0)) }
            baselineW()?.let{ out.add(Pair("Always-on baseline",it*24*30/1000.0)) }
            val today=LocalDate.now().toString()
            val cons=Daily.days.entries.filter{ it.key<today&&it.value[1]>0 }.sortedByDescending{it.key}.take(cov).map{it.value[1]}
            val total=if(cons.size>=3) cons.sum()*30.0/cons.size else null
            return Triple(out.sortedByDescending{it.second},total,cov)
          }

          @Composable fun BarRow(name:String,v:Double,max:Double,col:Color,sub:String){
            Column(Modifier.padding(vertical=4.dp)){
              Row(Modifier.fillMaxWidth(),Arrangement.SpaceBetween){
                Text(name,fontSize=12.sp,color=WHITE,modifier=Modifier.weight(1f))
                Text(fm(v,1)+" kWh",fontSize=12.sp,fontFamily=FontFamily.Monospace,color=col) }
              Box(Modifier.fillMaxWidth().height(8.dp).clip(RoundedCornerShape(4.dp)).background(TRACK)){
                Box(Modifier.fillMaxWidth((v/max).toFloat().coerceIn(0.02f,1f)).fillMaxHeight().background(col)) }
              if(sub.isNotEmpty()) Text(sub,fontSize=10.sp,color=DIM) }
          }

          val EQUIP=listOf("A/C","Coffee machine","Espresso machine","Water heater","Dryer","Washer","Oven","Microwave","Dishwasher","EV charger","Pool pump","Dehumidifier")
          val ROOMS=listOf("Main bedroom","Bedroom 1","Bedroom 2","Living room","Kitchen","Garage","Laundry","Outdoor")

          @Composable fun ColumnScope.AppliancesCard(sp:SharedPreferences){
            val ctx=LocalContext.current
            val ri=sp.getString("ri","0.25")!!.toDoubleOrNull()?:0.0; val cur=sp.getString("cu","$")!!
            var rev by remember{ mutableStateOf(0) }
            var show by remember{ mutableStateOf(false) }
            var editing by remember{ mutableStateOf<Cluster?>(null) }
            var equip by remember{ mutableStateOf("") }; var room by remember{ mutableStateOf("") }
            var nm by remember{ mutableStateOf("") }; var wt by remember{ mutableStateOf("") }; var hr by remember{ mutableStateOf("") }
            val clusters=remember(rev){ spikeClusters() }
            val manual=remember(rev){ Appl.load(sp) }
            val named=clusters.count{ Spk.nameFor(sp,it)!=null }
            val days=maxOf(1,minOf(30,Daily.days.keys.minOrNull()?.let{ (java.time.temporal.ChronoUnit.DAYS.between(LocalDate.parse(it),LocalDate.now())+1).toInt() }?:1))
            Section("REPEATED LOAD SPIKES",I_HOME,AMBER,summary="$named of ${clusters.size} named"){
              LaunchedEffect(Unit){ withContextIO{ EventLog.scan(ctx) }; rev++ }
              Text("Loads that switch on at about the same time of day, with about the same size, on several days. Tap one to say what it is.",fontSize=12.sp,color=DIM)
              PrefField(sp,"spikeW","Smallest jump to list (watts)","400")
              if(clusters.isEmpty()) Text("Nothing repeating yet. The list fills in after a few days, once the same jump has happened on at least 3 days. Keep the app running in the background.",fontSize=12.sp,color=AMBER)
              clusters.forEach{ c->
                val name=Spk.nameFor(sp,c)
                Column(Modifier.fillMaxWidth().padding(vertical=3.dp).clip(RoundedCornerShape(12.dp)).background(TILE)
                  .clickable{ editing=c; val p=(name?:"").split(" - "); equip=p.getOrElse(0){""}; room=p.getOrElse(1){""} }.padding(10.dp)){
                  Row(Modifier.fillMaxWidth(),Arrangement.SpaceBetween,Alignment.CenterVertically){
                    Text(fmtClock(c.timeMin),fontSize=14.sp,fontFamily=FontFamily.Monospace,fontWeight=FontWeight.Bold,color=WHITE)
                    Text("+"+fm(c.watts)+" W",fontSize=14.sp,fontFamily=FontFamily.Monospace,fontWeight=FontWeight.Bold,color=AMBER) }
                  Text(name?:"Tap to name this load",fontSize=13.sp,fontWeight=FontWeight.SemiBold,color=if(name==null) AMBER else GREEN)
                  Text("seen on ${c.dates.size} of the last $days days, about ${fm(c.minSum/c.n)} min each, ${fm(c.kwhSum/c.n,2)} kWh per run",fontSize=11.sp,color=DIM) } }
              val ed=editing
              if(ed!=null){
                val existing=Spk.load(sp).map{it.name}.distinct()
                AlertDialog(onDismissRequest={ editing=null },
                  title={ Text("+${fm(ed.watts)} W at ${fmtClock(ed.timeMin)}") },
                  text={ Column(verticalArrangement=Arrangement.spacedBy(8.dp),modifier=Modifier.horizontalScroll(rememberScrollState())){
                    if(existing.isNotEmpty()){
                      Text("Same as one you named before",fontSize=11.sp)
                      Row(horizontalArrangement=Arrangement.spacedBy(6.dp)){ existing.forEach{ n-> OutlinedButton({ val p=n.split(" - "); equip=p.getOrElse(0){""}; room=p.getOrElse(1){""} },contentPadding=PaddingValues(10.dp,2.dp)){ Text(n,fontSize=12.sp) } } } }
                    Text("Equipment",fontSize=11.sp)
                    Row(horizontalArrangement=Arrangement.spacedBy(6.dp)){ EQUIP.forEach{ e-> OutlinedButton({ equip=e },contentPadding=PaddingValues(10.dp,2.dp)){ Text(e,fontSize=12.sp) } } }
                    OutlinedTextField(equip,{ equip=it },label={ Text("Equipment") },singleLine=true)
                    Text("Room or place",fontSize=11.sp)
                    Row(horizontalArrangement=Arrangement.spacedBy(6.dp)){ ROOMS.forEach{ r-> OutlinedButton({ room=r },contentPadding=PaddingValues(10.dp,2.dp)){ Text(r,fontSize=12.sp) } } }
                    OutlinedTextField(room,{ room=it },label={ Text("Room (optional)") },singleLine=true) } },
                  confirmButton={ TextButton({ Spk.assign(sp,ed,if(equip.isBlank()) "" else equip.trim()+(if(room.isBlank()) "" else " - "+room.trim())); editing=null; rev++ }){ Text("Save") } },
                  dismissButton={ Row{
                    TextButton({ Spk.assign(sp,ed,""); editing=null; rev++ }){ Text("Clear name") }
                    TextButton({ editing=null }){ Text("Cancel") } } })
              }
              Button({ show=!show },Modifier.fillMaxWidth().padding(top=6.dp)){ Text(if(show) "Hide monthly breakdown" else "Show monthly breakdown") }
              if(show){
                val r=monthlyBreakdown(sp); val rows=r.first
                if(rows.isEmpty()) Text("Not enough data yet. Name a few spikes and keep the app running.",fontSize=12.sp,color=AMBER)
                else{
                  val cols=listOf(AMBER,CYAN,VIOLET,GREEN,BLUE,PINK); val mx=rows.maxOf{it.second}
                  rows.forEachIndexed{ k,(n,v)-> BarRow(n,v,mx,cols[k%cols.size],"about $cur${fm(v*ri,2)} a month") }
                  val sum=rows.sumOf{it.second}
                  Text(if(r.second!=null) "Together these account for about ${fm(sum/r.second!!*100)}% of your roughly ${fm(r.second!!)} kWh a month." else "A monthly total needs a few recorded days.",fontSize=11.sp,color=DIM,modifier=Modifier.padding(top=6.dp))
                  Text("Estimates from ${r.third} recorded day${if(r.third==1) "" else "s"}, scaled to 30 days. Loads that start in the same minute can merge, so treat this as a guide.",fontSize=11.sp,color=DIM) } }
              Text("Add by hand (for small or steady loads like Christmas lights)",fontSize=12.sp,fontWeight=FontWeight.Bold,color=WHITE,modifier=Modifier.padding(top=10.dp))
              manual.forEachIndexed{ idx,i->
                Row(Modifier.fillMaxWidth(),Arrangement.SpaceBetween,Alignment.CenterVertically){
                  Text("${i.name}: ${fm(i.w)} W for ${fm(i.manualH,1)} h a day",fontSize=12.sp,color=WHITE,modifier=Modifier.weight(1f))
                  TextButton({ Appl.save(sp,Appl.load(sp).filterIndexed{ k,_->k!=idx }); rev++ }){ Text("Remove",fontSize=12.sp) } } }
              OutlinedTextField(nm,{ nm=it },label={ Text("Item name") },singleLine=true,modifier=Modifier.fillMaxWidth())
              Row(Modifier.fillMaxWidth(),Arrangement.spacedBy(8.dp)){
                OutlinedTextField(wt,{ wt=it },label={ Text("Watts") },singleLine=true,modifier=Modifier.weight(1f))
                OutlinedTextField(hr,{ hr=it },label={ Text("Hours a day") },singleLine=true,modifier=Modifier.weight(1f)) }
              OutlinedButton({ val w=wt.toDoubleOrNull(); val h=hr.toDoubleOrNull()
                if(nm.isNotBlank()&&w!=null&&h!=null&&w>0&&h>0){ Appl.save(sp,Appl.load(sp)+Item(nm.trim(),w,h)); nm=""; wt=""; hr=""; rev++ } },Modifier.fillMaxWidth()){ Text("Add item") }
            }
          }
          suspend fun <T> withContextIO(block:suspend ()->T):T=kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO){ block() }
          EOF
          cat > app/src/main/java/com/lux/monitor/Backup.kt <<'EOF'
          package com.lux.monitor
          import android.content.ContentValues
          import android.content.Context
          import android.net.Uri
          import android.provider.MediaStore
          import org.json.JSONObject
          import java.io.File
          import java.util.zip.ZipEntry
          import java.util.zip.ZipInputStream
          import java.util.zip.ZipOutputStream

          object Backup{
            private val names=listOf("history.csv","daily.csv","monthly.csv")
            fun backup(ctx:Context):String{
              if(android.os.Build.VERSION.SDK_INT<29) return "Backup needs Android 10 or newer"
              val v=ContentValues().apply{put(MediaStore.Downloads.DISPLAY_NAME,"LuxMonitor_backup.zip");put(MediaStore.Downloads.MIME_TYPE,"application/zip")}
              val u=ctx.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI,v)?:return "Backup failed"
              ZipOutputStream(ctx.contentResolver.openOutputStream(u)).use{ z->
                for(n in names){ val f=File(ctx.filesDir,n); if(f.exists()){ z.putNextEntry(ZipEntry(n)); f.inputStream().use{it.copyTo(z)}; z.closeEntry() } }
                val j=JSONObject(); ctx.getSharedPreferences("c",0).all.forEach{ (k,x)-> j.put(k,x.toString()) }
                z.putNextEntry(ZipEntry("prefs.json")); z.write(j.toString().toByteArray()); z.closeEntry() }
              return "Saved to Downloads/LuxMonitor_backup.zip"
            }
            fun restore(ctx:Context,uri:Uri):String{
              val input=ctx.contentResolver.openInputStream(uri)?:return "Couldn't read the file"
              var n=0
              ZipInputStream(input).use{ z->
                var e=z.nextEntry
                while(e!=null){
                  if(e.name=="prefs.json"){
                    val j=JSONObject(String(z.readBytes())); val ed=ctx.getSharedPreferences("c",0).edit()
                    j.keys().forEach{ ed.putString(it,j.getString(it)) }; ed.apply(); n++
                  } else if(e.name in names){ File(ctx.filesDir,e.name).outputStream().use{ z.copyTo(it) }; n++ }
                  z.closeEntry(); e=z.nextEntry } }
              return if(n==0) "Not a Lux Monitor backup" else "Restored. Close the app completely and reopen it."
            }
          }
