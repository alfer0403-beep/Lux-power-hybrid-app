            val cellTMax:Double=27.5,val cellTMin:Double=26.1,val cycles:Int=112,val soh:Int=100,
            val totGen:Double=12840.0,val totExp:Double=7302.0,val totImp:Double=3121.0,val totChg:Double=2500.0,val totDis:Double=2310.0,val fault:Long=0,val warn:Long=0,
            val pv1:Int=0,val pv2:Int=0,val pv3:Int=0,val vEps:Double=0.0,val e1:Double=0.0,val e2:Double=0.0,val e3:Double=0.0,
            val bmsChgA:Double=0.0,val bmsDisA:Double=0.0,val batCount:Int=0,val batAh:Int=0)

          /** LuxPower WiFi dongle protocol (TCP 8000). Register numbers verified against the Lux Modbus register list. */
          object LuxClient {
            private const val PROTO = 2   // try 1 if the dongle doesn't answer
            private fun crc(b:ByteArray,n:Int):Int{var c=0xFFFF
              for(i in 0 until n){c=c xor (b[i].toInt() and 255);repeat(8){c=if(c and 1!=0)(c shr 1) xor 0xA001 else c shr 1}};return c}

            private fun req(datalog:String,serial:String,reg:Int,count:Int,func:Int=4):ByteArray{
              val d=ByteArray(18); d[1]=func.toByte()
              serial.toByteArray().copyInto(d,2)
              d[12]=reg.toByte();d[13]=(reg shr 8).toByte();d[14]=count.toByte();d[15]=(count shr 8).toByte()
              val c=crc(d,16);d[16]=c.toByte();d[17]=(c shr 8).toByte()
              val h=ByteArray(20);h[0]=0xA1.toByte();h[1]=0x1A;h[2]=PROTO.toByte();h[4]=(d.size+14).toByte()
              h[6]=1;h[7]=0xC2.toByte();datalog.toByteArray().copyInto(h,8);h[18]=d.size.toByte()
              return h+d
            }

            private var sock:Socket?=null
            private var sockHost=""
            @Synchronized fun close(){ runCatching{ sock?.close() }; sock=null }
            @Synchronized private fun conn(host:String,fast:Boolean=false):Socket{
              val c=sock
              if(c!=null&&!c.isClosed&&sockHost==host) return c
              close()
              val n=Socket(); n.connect(InetSocketAddress(host,8000),if(fast) 3000 else 8000); n.soTimeout=6000; n.keepAlive=true; n.tcpNoDelay=true
              sock=n; sockHost=host; return n
            }
            /** Keeps one connection open between polls (fewer handshakes for the dongle) and reconnects once automatically if it drops. */
            @Synchronized fun poll(host:String,datalog:String,serial:String,fast:Boolean=false):Lux{
              var last:Exception?=null
              for(attempt in 0..(if(fast) 0 else 1)){
                try{ return pollOnce(conn(host,fast),datalog,serial) }
                catch(e:Exception){ last=e; close() } }
              throw last!!
            }
            private fun pollOnce(s:Socket,datalog:String,serial:String):Lux{
              val r=IntArray(120); var b3=false
              run{
                val out=s.getOutputStream(); val inp=DataInputStream(s.getInputStream())
                for(base in intArrayOf(0,40,80)){
                  try{
                    out.write(req(datalog,serial,base,40));out.flush()
                    var got=false
                    repeat(8){ if(!got){
                      val h=ByteArray(8);inp.readFully(h)
                      val len=(h[4].toInt() and 255) or ((h[5].toInt() and 255) shl 8)
                      val rest=ByteArray(len-2);inp.readFully(rest)
