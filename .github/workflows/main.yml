              OkLine(checks[1],"Solar on a low-sun day: about ${fm(prodLow)} kWh vs ${fm(needDay)} kWh needed (average use ${fm(eDay)} kWh/day +10%).")
              OkLine(checks[2],"One full day with no sun: ${fm(usable,1)} kWh usable vs ${fm(dayKwh,1)} kWh needed.")
              OkLine(checks[3],"Power: recorded peak load ${fm(peakKw,1)} kW vs inverter ${fm(invKw,1)} kW"+(if(x.bmsDisA>0) "; batteries allow ${fm(bmsKw,1)} kW" else "")+".")

