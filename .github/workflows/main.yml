                  }catch(e:Exception){ if(base==0) throw e else break }
                }
              }
              fun e(i:Int)=r[i]/10.0
              fun sg(v:Int)=if(v>=32768) v-65536 else v
              fun l(i:Int)=((r[i+1].toLong() shl 16) or r[i].toLong())/10.0
              val pv=r[7]+r[8]+r[9]
              val imp=e(37); val exp=e(36)
              val calc=maxOf(0,r[27]+r[16]+r[24]-r[17]-r[26])
              val load=if(r[0]==64) r[24] else if(b3&&!(r[114]==0&&calc>300)) r[114] else calc
              return Lux(r[5] and 255,r[4]/10.0,pv,r[10],r[11],r[27],r[26],load,r[12]/10.0,r[15]/100.0,
                e(28)+e(29)+e(30),maxOf(0.0,imp+e(31)+e(35)-e(32)-exp),e(33),e(34),imp,exp,r[0],
                tInv=sg(r[64]).toDouble(),tBat=sg(r[67]).toDouble(),cellMaxV=r[101]/1000.0,cellMinV=r[102]/1000.0,
                cellTMax=sg(r[103])/10.0,cellTMin=sg(r[104])/10.0,cycles=r[106],soh=(r[5] shr 8) and 255,
                totGen=l(40)+l(42)+l(44),totExp=l(56),totImp=l(58),totChg=l(50),totDis=l(52),
                fault=(r[61].toLong() shl 16) or r[60].toLong(),warn=(r[63].toLong() shl 16) or r[62].toLong(),
                pv1=r[7],pv2=r[8],pv3=r[9],vEps=r[20]/10.0,e1=e(28),e2=e(29),e3=e(30),bmsChgA=r[81]/100.0,bmsDisA=r[82]/100.0,batCount=r[96],batAh=r[97])
            }

            private fun packet(h:DataInputStream):ByteArray{
              val hd=ByteArray(8); h.readFully(hd)
              val len=(hd[4].toInt() and 255) or ((hd[5].toInt() and 255) shl 8)
              val rest=ByteArray(len-2); h.readFully(rest); return hd+rest }
            /** Reads one holding register (function 3). */
            @Synchronized fun readHold(host:String,datalog:String,serial:String,reg:Int):Int{
              close()
              Socket().use{s->
                s.connect(InetSocketAddress(host,8000),8000);s.soTimeout=5000
                s.getOutputStream().apply{write(req(datalog,serial,reg,1,3));flush()}
                val inp=DataInputStream(s.getInputStream())
                repeat(8){ val p=packet(inp)
                  if(p[7]==0xC2.toByte()&&p.size>=37&&p[21].toInt()==3&&((p[32].toInt() and 255) or ((p[33].toInt() and 255) shl 8))==reg)
                    return (p[35].toInt() and 255) or ((p[36].toInt() and 255) shl 8) } }
              error("No reply reading register $reg")
            }
            /** Writes one holding register (function 6). Always read back afterwards to confirm. */
            @Synchronized fun writeHold(host:String,datalog:String,serial:String,reg:Int,value:Int){
              close()
              Socket().use{s->
                s.connect(InetSocketAddress(host,8000),8000);s.soTimeout=5000
                s.getOutputStream().apply{write(req(datalog,serial,reg,value,6));flush()}
                runCatching{ packet(DataInputStream(s.getInputStream())) } }
            }
          }
