                  if(Th.auto) Row(Modifier.padding(top=8.dp),horizontalArrangement=Arrangement.spacedBy(8.dp),verticalAlignment=Alignment.CenterVertically){
                    Text("Daytime look:",fontSize=11.sp,color=DIM)
                    listOf(0 to "Midnight Neon",2 to "Arctic").forEach{ (i,n)->
                      Button({ Th.dayIdx=i; Th.idx=if(isNight(sp)) 1 else i; sp.edit().putString("autoDay",i.toString()).apply() },contentPadding=PaddingValues(10.dp,2.dp),
                        colors=ButtonDefaults.buttonColors(containerColor=if(Th.dayIdx==i) CYAN else TILE,contentColor=if(Th.dayIdx==i) Color.Black else WHITE)){ Text(n,fontSize=11.sp) } } } } } }
          }

          @Composable fun IconPackCard(sp:SharedPreferences){
            Card(Modifier.fillMaxWidth(),shape=RoundedCornerShape(14.dp),colors=CardDefaults.cardColors(containerColor=CARD)){
              Column(Modifier.padding(12.dp),verticalArrangement=Arrangement.spacedBy(8.dp)){
                Text("Icon pack",fontSize=13.sp,fontWeight=FontWeight.SemiBold,color=WHITE)
                Packs.list.forEachIndexed{ i,pk->
                  val sel=Packs.idx==i
                  Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).background(if(sel) TRACK else TILE)
                    .clickable{ Packs.idx=i; sp.edit().putString("pack",i.toString()).apply() }.padding(10.dp),verticalAlignment=Alignment.CenterVertically){
                    Column(Modifier.weight(1f)){
                      Text(pk.name,fontSize=13.sp,fontWeight=FontWeight.Bold,color=WHITE)
                      Text(pk.blurb,fontSize=11.sp,color=DIM)
                      Canvas(Modifier.fillMaxWidth().height(44.dp).padding(top=8.dp)){
                        val g=size.height*0.62f
                        listOf(pk.sol to AMBER,pk.grid to CYAN,pk.home to VIOLET,pk.bat to GREEN,pk.inv to CYAN,pk.live to AMBER).forEachIndexed{ k,e->
                          icon(e.first,e.second,Offset(g*0.9f+k*g*1.9f,size.height/2f),g,true,false,pk) } } }
                    if(sel) Text("Selected",fontSize=11.sp,fontWeight=FontWeight.Bold,color=GREEN) } } } }
          }
