          }

          /** What it would take to run fully off-grid, from your own usage, solar, battery and inverter data. */
          @Composable fun ColumnScope.OffGridCard(sp:SharedPreferences){
            val scope=rememberCoroutineScope()
            val live=Store.d
            val x=live?:Lux(62,53.2,0,0,0,0,0,900,bmsChgA=150.0,bmsDisA=150.0,batCount=3,batAh=300)
            val cap=sp.getString("c","15.36")!!.toDoubleOrNull()?:15.36; val res=sp.getString("r","10")!!.toIntOrNull()?:10
            val coords=sp.getString("lat","")!!.isNotBlank()&&sp.getString("lon","")!!.isNotBlank()
            val src=Store.fc?:(if(!coords) sampleFc() else null)
            val kwp=sp.getString("kwp","10")!!.toDoubleOrNull()?:10.0
            val fr=src?.let{ forecast(it,kwp) }
            val planKwh=sp.getString("ogkwh","40")!!.toDoubleOrNull()?:40.0
            val planKw=sp.getString("ogkw","2")!!.toDoubleOrNull()?:2.0
            val today=LocalDate.now().toString()
            val rec=Daily.days.entries.filter{ it.key<today&&it.value[1]>1 }.sortedByDescending{it.key}.take(14).map{it.value[1]}
            val lm=Monthly.lastComplete()
            val eDay=if(rec.size>=3) rec.average() else if(lm!=null) lm.second[1]/YearMonth.parse(lm.first).lengthOfMonth() else 25.0
            val rads=src?.rad?.filter{it>0.5}?.sorted()
            val radLow=if(rads!=null&&rads.size>=5) rads[(rads.size*0.25).toInt()] else 3.5
            val k=fr?.k?:(kwp*0.8)
