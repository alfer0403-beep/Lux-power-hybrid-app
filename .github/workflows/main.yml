            val eff=0.94*(1-res/100.0)
            val usable=cap*eff
            val bankNight=nightKwh/eff; val bankDay=dayKwh/eff
            val addNight=maxOf(0,Math.ceil((bankNight-cap)/5.12).toInt()); val addDay=maxOf(0,Math.ceil((bankDay-cap)/5.12).toInt())
            val peakKw=(History.pts.maxOfOrNull{it.load}?:x.load)/1000.0
