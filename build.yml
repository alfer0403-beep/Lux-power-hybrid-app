          fun DrawScope.icon(p:Path,col:Color,c:Offset,s:Float,glow:Boolean=true,keep:Boolean=false,pack:IconPack=Packs.cur){
            val mode=pack.mode
            if(mode==2){
              drawRoundRect(col,Offset(c.x-s*0.66f,c.y-s*0.66f),Size(s*1.32f,s*1.32f),CornerRadius(s*0.32f))
              val g=s*0.62f
              withTransform({translate(c.x-g/2,c.y-g/2);scale(g/24f,g/24f,Offset.Zero)}){
                if(pack.fills.contains(p)) drawPath(p,Color.White)
                drawPath(p,Color.White,style=Stroke(2.2f,cap=StrokeCap.Round,join=StrokeJoin.Round)) }
            } else {
              val cc=if(mode==1&&!keep) (if(col==DIM) DIM else WHITE) else col
              withTransform({translate(c.x-s/2,c.y-s/2);scale(s/24f,s/24f,Offset.Zero)}){
                if(mode==0&&glow) drawPath(p,cc.copy(alpha=.3f),style=Stroke(4.5f,cap=StrokeCap.Round,join=StrokeJoin.Round))
                drawPath(p,cc,style=if(mode==1) Stroke(1.5f,cap=StrokeCap.Butt,join=StrokeJoin.Miter) else Stroke(1.9f,cap=StrokeCap.Round,join=StrokeJoin.Round)) } }
          }
          fun DrawScope.label(tm:TextMeasurer,s:String,x:Float,y:Float,px:Float,col:Color,mono:Boolean=false,bold:Boolean=false,center:Boolean=false){
            val m=tm.measure(s,TextStyle(color=col,fontSize=px.toSp(),fontFamily=if(mono) FontFamily.Monospace else FontFamily.Default,fontWeight=if(bold) FontWeight.Bold else FontWeight.Normal))
            drawText(m,topLeft=Offset(if(center) x-m.size.width/2f else x,y-m.size.height/2f))
          }
          @Composable fun Ico(p:Path,c:Color,s:Int=16,glow:Boolean=true,keep:Boolean=false){ Canvas(Modifier.size(s.dp)){ icon(p,c,Offset(size.width/2,size.height/2),size.width*(if(Packs.cur.mode==2) 0.75f else 1f),glow,keep) } }

          @Composable fun Hero(x:Lux,rt:String){
            val t by rememberInfiniteTransition(label="f").animateFloat(0f,1f,infiniteRepeatable(tween(900,easing=LinearEasing)),label="p")
            val tm=rememberTextMeasurer()
            Canvas(Modifier.fillMaxWidth().aspectRatio(358f/290f)){
              val k=size.width/358f
              fun P(a:Float,b:Float)=Offset(a*k,b*k)
              fun flow(a:Offset,b:Offset,on:Boolean,col:Color)=drawLine(if(on) col else LINE2,a,b,3f*k,
                pathEffect=if(on) PathEffect.dashPathEffect(floatArrayOf(4*k,6*k),(1f-t)*10*k) else null)
              fun pill(px:Float,py:Float,w:Float,h:Float,col:Color,fill:Color,ic:Path,lab:String,v:String,sub:String,tx:Float,vs:Float){
                drawRoundRect(fill,P(px,py),Size(w*k,h*k),CornerRadius(14*k))
                drawRoundRect(col.copy(alpha=.6f),P(px,py),Size(w*k,h*k),CornerRadius(14*k),style=Stroke(k))
                icon(ic,col,P(px+20,py+h/2),22*k)
                label(tm,lab,tx*k,(py+13)*k,9*k,col); label(tm,v,tx*k,(py+31)*k,vs*k,WHITE,mono=true,bold=true); label(tm,sub,tx*k,(py+51)*k,8.5f*k,DIM,mono=true) }
              val c=P(179f,150f)
              flow(P(179f,68f),P(179f,90f),x.pv>20,AMBER)
              if(x.gridOut>20) flow(P(119f,150f),P(100f,150f),true,CYAN) else flow(P(100f,150f),P(119f,150f),x.gridIn>20,BLUE)
              flow(P(239f,150f),P(258f,150f),x.load>20,VIOLET)
              drawCircle(TRACK,60*k,c,style=Stroke(10*k))
              drawArc(Brush.linearGradient(if(x.soc>20) listOf(CYAN,GREEN) else listOf(AMBER,RED),P(119f,90f),P(239f,210f)),-90f,360f*x.soc/100f,false,
                c-Offset(60*k,60*k),Size(120*k,120*k),style=Stroke(10*k,cap=StrokeCap.Round))
              drawCircle(DEEP,46*k,c); drawCircle(LINE,46*k,c,style=Stroke(k))
              icon(I_BAT,GREEN,P(179f,116f),16*k)
              label(tm,"${x.soc}%",179*k,141*k,28*k,WHITE,mono=true,bold=true,center=true)
              val st=if(x.charge>20) "CHARGING "+kw(x.charge) else if(x.discharge>20) "DISCHARGING "+kw(x.discharge) else "IDLE \u00B7 0 W"
              label(tm,st,179*k,167*k,9*k,GREEN,center=true)
              val gs="${x.vGrid.toInt()}V ${"%.1f".format(x.fGrid)}Hz"
              pill(84f,2f,190f,66f,AMBER,AMBER.copy(alpha=.12f),I_SOL,"SOLAR  (S1 \u00B7 S2 \u00B7 S3)",kw(x.pv),"${x.pv1} \u00B7 ${x.pv2} \u00B7 ${x.pv3} W",126f,18f)
              if(x.gridOut>20||x.gridIn<=20) pill(2f,118f,98f,64f,CYAN,CYAN.copy(alpha=.12f),I_GRID,"EXPORT",kw(x.gridOut),gs,34f,14f)
              else pill(2f,118f,98f,64f,BLUE,BLUE.copy(alpha=.12f),I_GRID,"IMPORT",kw(x.gridIn),gs,34f,14f)
              pill(258f,118f,98f,64f,VIOLET,VIOLET.copy(alpha=.12f),I_HOME,"HOME",kw(x.load),if(x.vEps>0) "${x.vEps.toInt()} V" else "\u2013 V",290f,14f)
              drawRoundRect(DEEP,P(59f,232f),Size(240*k,46*k),CornerRadius(23*k))
              drawRoundRect(LINE,P(59f,232f),Size(240*k,46*k),CornerRadius(23*k),style=Stroke(k))
              icon(I_RUN,GREEN,P(88f,255f),22*k)
              label(tm,"RUNTIME AT LOAD \u00B7 NO PV",196*k,243*k,9*k,DIM,center=true)
              label(tm,rt,196*k,262*k,15*k,GREEN,mono=true,bold=true,center=true)
            }
          }

