          val CSER:List<Pair<String,Color>> get()=listOf("Solar" to AMBER,"Battery" to GREEN,"Grid" to CYAN,"Load" to VIOLET,"SOC" to PINK)
          val DS:List<List<Float>> = run{
            val sol=ArrayList<Float>();val bat=ArrayList<Float>();val grd=ArrayList<Float>();val con=ArrayList<Float>();val soc=ArrayList<Float>()
            var s=30f
            for(i in 0 until 96){
              val so=if(i in 24..72) 7000f*kotlin.math.sin(Math.PI.toFloat()*(i-24)/48f) else 0f
              val c=800f+300f*kotlin.math.sin(i/6f); val b=if(so>c) minOf(2800f,so-c) else 0f
              sol.add(so);con.add(c);bat.add(b);grd.add(so-c-b); s=minOf(100f,s+b/3000f); soc.add(s) }
            listOf(sol,bat,grd,con,soc)
          }

          @Composable fun Chart(d:List<List<Float>>,ht:Dp=210.dp){
            val tm=rememberTextMeasurer()
            Canvas(Modifier.fillMaxWidth().height(ht)){
              val h=size.height; val w=size.width; val pl=30.dp.toPx(); val pr=32.dp.toPx(); val pw=w-pl-pr
              val mx=d.take(4).maxOf{it.maxOrNull()?:0f}; val mn=d.take(4).minOf{it.minOrNull()?:0f}
              val step=if(mx>12000f) 4000f else 2000f
              val hi=maxOf(step,kotlin.math.ceil(mx/step)*step); val lo=if(mn<0f) kotlin.math.floor(mn/step)*step else 0f
              fun yP(v:Float)=h-(v-lo)/(hi-lo)*h
              fun lab(s:String,x:Float,y:Float,col:Color,right:Boolean){
                val t=tm.measure(s,TextStyle(color=col,fontSize=9.sp,fontFamily=FontFamily.Monospace))
                drawText(t,topLeft=Offset(if(right) x else x-t.size.width,(y-t.size.height/2f).coerceIn(0f,h-t.size.height))) }
              var v=lo
              while(v<=hi+1f){ val y=yP(v)
                drawLine(if(v==0f) LINE2 else LINE,Offset(pl,y),Offset(pl+pw,y),1.dp.toPx(),pathEffect=if(v==0f) null else PathEffect.dashPathEffect(floatArrayOf(6f,8f)))
                lab("%.0f".format(v/1000f),pl-4.dp.toPx(),y,DIM,false); v+=step }
              for(s in intArrayOf(0,50,100)) lab("$s%",pl+pw+4.dp.toPx(),h-s/100f*h,PINK,true)
              val zy=yP(0f)
              d.forEachIndexed{k,vs-> if(vs.size>1){
                val path=Path()
                vs.forEachIndexed{i,y->
                  val py=if(k==4) h-y/100f*h else yP(y); val px=pl+pw*i/(vs.size-1)
                  if(i==0) path.moveTo(px,py) else path.lineTo(px,py) }
                if(k==0){ val f=Path(); f.addPath(path); f.lineTo(pl+pw,zy); f.lineTo(pl,zy); f.close(); drawPath(f,AMBER.copy(alpha=.2f)) }
                drawPath(path,CSER[k].second,style=if(k==4) Stroke(1.5.dp.toPx(),pathEffect=PathEffect.dashPathEffect(floatArrayOf(14f,10f))) else Stroke(2.dp.toPx(),cap=StrokeCap.Round,join=StrokeJoin.Round)) } }
            }
          }

          @Composable fun Legend(d:List<List<Float>>,note:Boolean=true){
            Row(Modifier.fillMaxWidth().padding(top=10.dp),Arrangement.SpaceBetween){
              CSER.forEachIndexed{k,e->
                val v=d[k].lastOrNull()
                Column(horizontalAlignment=Alignment.CenterHorizontally){
                  Text("\u25CF "+e.first,fontSize=11.sp,color=e.second)
                  Text(if(v==null) "\u2013" else if(k==4) "${v.toInt()}%" else "%.2f kW".format(v/1000f),fontSize=11.sp,fontFamily=FontFamily.Monospace,color=WHITE) } } }
            if(note) Text("Left axis: kW (solar, battery, grid, load). Right axis: battery %. Battery + = charging, \u2212 = discharging. Grid + = export, \u2212 = import.",fontSize=11.sp,color=DIM,modifier=Modifier.padding(top=8.dp))
          }

          fun timeLabels(range:Int):List<String>{
            val n=System.currentTimeMillis()
            val (ms,fmt)=when(range){0->3600000L to "HH:mm";1->86400000L to "EEE HH:mm";else->7*86400000L to "EEE d"}
            val f=java.text.SimpleDateFormat(fmt,java.util.Locale.getDefault())
            return listOf(f.format(java.util.Date(n-ms)),f.format(java.util.Date(n-ms/2)),"now")
          }

          fun stateText(s:Int)=when(s){0,17->"Standby";1->"Fault";2->"Updating";4->"PV powering load, exporting surplus"
            8->"PV powering load & charging battery";12->"PV powering load, charging battery & exporting";16->"Battery discharging to load, exporting surplus"
            20->"PV & battery powering load, exporting surplus";32->"Grid charging battery";40->"Grid & PV charging battery";64->"Off-grid: battery powering load"
            96->"Off-grid: AC-coupled PV charging battery";136->"Off-grid: PV powering load & charging battery";192->"Off-grid: PV & battery powering load";else->"State $s"}
          fun chartData(range:Int):List<List<Float>>{
            val src:List<Pt> = if(range==0) Store.series.map{Pt(0,it.pv,it.charge-it.discharge,it.gridOut-it.gridIn,it.load,it.soc)}
              else { val cut=System.currentTimeMillis()-(if(range==1) 86400000L else 7*86400000L); History.pts.filter{it.t>=cut} }
            val st=maxOf(1,src.size/240); val s=src.filterIndexed{i,_->i%st==0}
            return listOf(s.map{it.pv.toFloat()},s.map{it.bat.toFloat()},s.map{it.grid.toFloat()},s.map{it.load.toFloat()},s.map{it.soc.toFloat()})
          }
          fun hm(h:Double)=if(h>99) "99h+" else "${h.toInt()}h ${((h-h.toInt())*60).toInt()}m"
