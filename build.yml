                      else if(Store.d!=null&&Store.via=="cloud"){ xo=Store.d; via="cloud" } }
                    if(xo==null&&lastErr==null) lastErr=IllegalStateException("Waiting to retry the inverter")
                    val x:Lux=xo?:throw lastErr!!
                    Store.via=via
                    if(fail>=4&&extra) notifier(ctx).cancel(5)
                    fail=0; lastOk=System.currentTimeMillis(); offlineSince=0L; offlineSent=false
                    Store.d=x; Store.err=""; Store.series.add(x); while(Store.series.size>maxS) Store.series.removeAt(0)
                    hist.addLast(x.load); while(hist.size>win) hist.removeFirst()
                    val avg=maxOf(50.0,hist.average())
                    val hours=cap*1000*maxOf(0,x.soc-res)/100*0.94/avg
                    Store.runtime=if(x.charge>x.discharge+50) "Full in "+hm(cap*1000*(100-x.soc)/100/x.charge) else hm(hours)
