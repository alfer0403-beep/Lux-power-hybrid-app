                      lastWarn=x.warn
                      val hot=x.tBat>=45||x.cellTMax>=45
                      if(hot&&!hotSent){ alert(ctx,6,"Battery temperature high","Battery ${x.tBat.toInt()}\u00B0C, hottest cell ${x.cellTMax}\u00B0C"); hotSent=true } else if(!hot) hotSent=false
                      val dmv=(x.cellMaxV-x.cellMinV)*1000
