          /** style: 0 = line icons, 1 = solid duotone icons, 2 = badge-tile icons */
          class ThemeDef(val name:String,val blurb:String,val style:Int,
            val bg:Color,val card:Color,val line:Color,val line2:Color,val dim:Color,val text:Color,val tile:Color,val track:Color,val deep:Color,val chip:Color,
            val solar:Color,val grid:Color,val gridIn:Color,val home:Color,val battery:Color,val soc:Color)

          /** Sunrise and sunset as local minutes after midnight (NOAA approximation), or null in polar day/night. */
          fun sunTimes(lat:Double,lon:Double,d:LocalDate):Pair<Int,Int>?{
            val n=d.dayOfYear; val b=2*Math.PI*(n-1)/365.0
            val eq=229.18*(0.000075+0.001868*Math.cos(b)-0.032077*Math.sin(b)-0.014615*Math.cos(2*b)-0.040849*Math.sin(2*b))
            val decl=0.006918-0.399912*Math.cos(b)+0.070257*Math.sin(b)-0.006758*Math.cos(2*b)+0.000907*Math.sin(2*b)-0.002697*Math.cos(3*b)+0.00148*Math.sin(3*b)
            val la=Math.toRadians(lat)
            val c=(Math.cos(Math.toRadians(90.833))-Math.sin(la)*Math.sin(decl))/(Math.cos(la)*Math.cos(decl))
            if(c>1||c<-1) return null
            val h=Math.toDegrees(Math.acos(c))
            val off=ZoneId.systemDefault().rules.getOffset(Instant.now()).totalSeconds/60
            val rise=(720-4*(lon+h)-eq+off).toInt(); val set=(720-4*(lon-h)-eq+off).toInt()
            return Pair(((rise%1440)+1440)%1440,((set%1440)+1440)%1440)
          }
          fun isNight(sp:SharedPreferences):Boolean{
            val lat=sp.getString("lat","")!!.toDoubleOrNull(); val lon=sp.getString("lon","")!!.toDoubleOrNull()
            val t=java.time.LocalTime.now(); val now=t.hour*60+t.minute
            val st=if(lat!=null&&lon!=null) sunTimes(lat,lon,LocalDate.now()) else null
            val rise=st?.first?:390; val set=st?.second?:1110
            return if(rise<set) now<rise||now>=set else now in set until rise
          }

