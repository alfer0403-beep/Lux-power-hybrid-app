            var v by remember{mutableStateOf(sp.getString(key,def)!!)}
            OutlinedTextField(v,{v=it;sp.edit().putString(key,it).apply()},label={Text(label)},singleLine=true,modifier=mod)
          }
          @Composable fun PrefSwitch(sp:SharedPreferences,key:String,label:String,def:String="1"){
            var v by remember{mutableStateOf(sp.getString(key,def)=="1")}
            Row(Modifier.fillMaxWidth(),Arrangement.SpaceBetween,Alignment.CenterVertically){
              Text(label,color=WHITE,fontSize=13.sp,modifier=Modifier.weight(1f).padding(end=8.dp))
