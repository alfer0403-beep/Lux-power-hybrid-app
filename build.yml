          /** Average household load for each hour of the day, learned from the saved 7-day history. */
          fun loadProfile(fallback:Double):DoubleArray{
            val sum=DoubleArray(24); val n=IntArray(24); val z=ZoneId.systemDefault()
            History.pts.forEach{ val h=Instant.ofEpochMilli(it.t).atZone(z).hour; sum[h]+=it.load.toDouble(); n[h]++ }
            val tot=if(n.sum()>0) sum.sum()/n.sum() else fallback
            return DoubleArray(24){ if(n[it]>=5) sum[it]/n[it] else tot }
          }

          class Outlook(val emptyAt:LocalDateTime?,val minSoc:Int,val socAt:Int?)
          fun sunriseOf(f:Fc):LocalDateTime?{
            val r=f.hrs.associate{it.first to it.second}
            var t=LocalDateTime.now().truncatedTo(ChronoUnit.HOURS).plusHours(1)
            for(i in 0 until 47){ if((r[t]?:0.0)>50&&(r[t.minusHours(1)]?:0.0)<=50) return t; t=t.plusHours(1) }
            return null
          }
          /** Hour-by-hour battery simulation for the next 48 h if the grid were down. */
          fun simulate(f:Fc,k:Double,soc:Int,cap:Double,res:Int,prof:DoubleArray,sun:Boolean,target:LocalDateTime?):Outlook{
            val capWh=cap*1000; val resWh=capWh*res/100; var e=capWh*soc/100
            val rad=f.hrs.associate{it.first to it.second}
            var t=LocalDateTime.now().truncatedTo(ChronoUnit.HOURS)
            var minE=e; var at:Int?=null
            for(i in 0 until 48){
              if(t==target) at=(e/capWh*100).toInt()
              val net=(if(sun) k*(rad[t]?:0.0) else 0.0)-prof[t.hour]
              e=if(net>0) minOf(capWh,e+net*0.95) else e+net/0.94
              if(e<minE) minE=e
              if(e<=resWh) return Outlook(t,res,at)
              t=t.plusHours(1)
            }
            return Outlook(null,(minE/capWh*100).toInt(),at)
          }
          class Win(val start:LocalDateTime,val end:LocalDateTime,val kw:Double)
          fun bestWindow(f:Fc,k:Double,prof:DoubleArray):Win?{
            val now=LocalDateTime.now().truncatedTo(ChronoUnit.HOURS); val rad=f.hrs.associate{it.first to it.second}
            var best:Win?=null
            for(i in 0..20){
              val s=now.plusHours(i.toLong())
              val avg=(0..2).map{ val t=s.plusHours(it.toLong()); k*(rad[t]?:0.0)-prof[t.hour] }.average()
              val b=best
              if(b==null||avg/1000.0>b.kw) best=Win(s,s.plusHours(3),avg/1000.0) }
            return best?.takeIf{it.kw>0.5}
          }
          fun peakShare(ps:Int,pe:Int):Double?{
            var tot=0.0; var pk=0.0; val z=ZoneId.systemDefault()
            History.pts.forEach{ if(it.grid<0){ val w=-it.grid.toDouble(); tot+=w; val h=Instant.ofEpochMilli(it.t).atZone(z).hour
              if(if(ps<=pe) h>=ps&&h<pe else h>=ps||h<pe) pk+=w } }
            return if(tot>0) pk/tot else null
          }
          class SH(val name:String,val share:Double,val normal:Double)
          fun panelHealth():List<SH>?{
            val days=Daily.days.entries.filter{it.value.size>9&&it.value[6]+it.value[7]+it.value[8]>3}.sortedBy{it.key}.takeLast(15)
            if(days.size<3) return null
            fun share(v:List<Double>,i:Int)=v[6+i]/(v[6]+v[7]+v[8])
            val last=days.last().value; val hist=days.dropLast(1)
            return (0..2).map{ i-> SH("String ${i+1}",share(last,i),hist.map{ share(it.value,i) }.sorted().let{ l->l[l.size/2] }) }
          }
          fun cellTrend():Pair<Double,Double>?{
            val v=Daily.days.entries.filter{it.value.size>9&&it.value[9]>0}.sortedBy{it.key}.map{it.value[9]}
            if(v.size<4) return null
            val recent=v.takeLast(7).average(); val before=v.dropLast(7).takeLast(14).average()
            return Pair(recent,if(before.isNaN()) recent else before)
          }

          class NW(val startMin:Int,val endMin:Int,val impKwh:Double,val loadKwh:Double)
          class NightStat(val n:Int,val startMin:Int,val endMin:Int,val impAvg:Double,val impMin:Double,val impMax:Double,val loadAvg:Double,val loadMax:Double,val hours:Double)
          fun fmtMin(m:Int):String="%02d:%02d".format(m/60,m%60)

          /** For each recent evening: from when the grid started supplying (import above 150 W for 10 minutes after noon)
           *  until the sun fully took over next morning (solar covering the load for 10 minutes after 04:00). */
          fun nightWindows():List<NW>{
            val z=ZoneId.systemDefault()
            val pts=History.pts.toList().sortedBy{it.t}
            if(pts.size<200) return emptyList()
            val ts=pts.map{ Instant.ofEpochMilli(it.t).atZone(z).toLocalDateTime() }
            fun imp(i:Int)=maxOf(0,-pts[i].grid)
            val out=ArrayList<NW>()
            var d=ts.first().toLocalDate(); val last=ts.last().toLocalDate()
            while(d.isBefore(last)){
              val from=d.atTime(12,0); val to=d.plusDays(1).atTime(12,0)
              val idx=pts.indices.filter{ ts[it]>=from&&ts[it]<to }
              fun run(k:Int,c:(Int)->Boolean):Boolean{ if(k+10>idx.size) return false; for(j in k until k+10) if(!c(idx[j])) return false; return true }
              var si=-1
              for(k in idx.indices){ if(ts[idx[k]].toLocalDate()!=d) break; if(imp(idx[k])>150&&run(k){ imp(it)>150 }){ si=k; break } }
              var ek=-1
              if(si>=0) for(k in si+1 until idx.size){ val t=ts[idx[k]]
                if(t.toLocalDate()==d.plusDays(1)&&t.hour>=4&&run(k){ pts[it].pv>=pts[it].load&&imp(it)<150 }){ ek=k; break } }
              if(si>=0&&ek>si){
                var ik=0.0; var lk=0.0; var gap=0.0
                for(k in si until ek){
                  val sec=java.time.Duration.between(ts[idx[k]],ts[idx[k+1]]).seconds
                  gap=maxOf(gap,sec.toDouble()); val h=minOf(sec,300L)/3600.0
                  ik+=imp(idx[k])*h/1000.0; lk+=pts[idx[k]].load*h/1000.0 }
                val dur=java.time.Duration.between(ts[idx[si]],ts[idx[ek]]).toMinutes()
                if(gap<=900&&dur>=120) out.add(NW(ts[idx[si]].hour*60+ts[idx[si]].minute,ts[idx[ek]].hour*60+ts[idx[ek]].minute,ik,lk)) }
              d=d.plusDays(1)
            }
            return out
          }
          fun nightStat():NightStat?{
            val w=nightWindows(); if(w.isEmpty()) return null
            val s=w.map{it.startMin}.average().toInt(); val e=w.map{it.endMin}.average().toInt()
            return NightStat(w.size,s,e,w.map{it.impKwh}.average(),w.minOf{it.impKwh},w.maxOf{it.impKwh},w.map{it.loadKwh}.average(),w.maxOf{it.loadKwh},(e+1440-s)/60.0)
          }

          @Composable fun OutlookLine(title:String,o:Outlook?,sr:LocalDateTime?){
            if(o==null) return
            val e=o.emptyAt
            val bad=e!=null&&sr!=null&&e.isBefore(sr)
            val txt=if(e!=null) "Runs down to reserve "+fmtT(e)+(if(sr!=null) (if(bad) " - BEFORE sunrise" else " - after sunrise") else "")
              else "Lasts 48 h or more. Lowest ${o.minSoc}%"
            Column(Modifier.padding(vertical=4.dp)){
              Text(title,fontSize=11.sp,color=DIM)
              Text(txt+(o.socAt?.let{" - about $it% at sunrise"}?:""),fontSize=13.sp,color=if(bad) RED else GREEN) }
          }

