          class Ev(val t:Long,val watts:Double,val minutes:Int,val kwh:Double)
          class Sig(val bucket:Int,val n:Int,val kwh:Double,val avgMin:Double)

          /** Finds appliance-style load steps (rise of 700 W or more that later drops back) in the last 7 days of 1-minute history. */
          fun loadEvents(thr:Double=700.0,maxMin:Int=360):List<Ev>{
            val pts=History.pts.toList().sortedBy{it.t}
            if(pts.size<300) return emptyList()
            val l=pts.map{ it.load.toDouble() }
            fun med(a:Int,b:Int):Double{ val s=l.subList(a,b).sorted(); return s[s.size/2] }
            val out=ArrayList<Ev>(); var i=6
            while(i<pts.size-8){
              if(pts[i+6].t-pts[i-6].t>14*60000L){ i++; continue }
              val pre=med(i-6,i-1); val d=med(i+1,i+6)-pre
              if(d>=thr){
                var j=i+6; var end=-1
                while(j<pts.size-5&&j<i+maxMin){
                  if(pts[j].t-pts[j-1].t>5*60000L) break
                  if(med(j,j+5)<pre+0.3*d){ end=j; break }
                  j++ }
                if(end>0){
                  var e=0.0
                  for(k in i until end){ val dt=minOf(pts[k+1].t-pts[k].t,300000L)/3600000.0; e+=maxOf(0.0,l[k]-pre)*dt/1000.0 }
                  val minutes=((pts[end].t-pts[i].t)/60000).toInt()
                  if(minutes>=3) out.add(Ev(pts[i].t,d,minutes,e))
                  i=end } else i+=6
              } else i++
            }
            return out
          }
          fun signatures(ev:List<Ev>):List<Sig> =
            ev.groupBy{ (Math.round(it.watts/300.0)*300).toInt() }.filter{ it.value.size>=2 }
              .map{ (b,l)-> Sig(b,l.size,l.sumOf{it.kwh},l.map{it.minutes}.average()) }.sortedByDescending{it.kwh}
          fun guessLoad(w:Int,n:Int,min:Double):String=when{
            w>=5000 -> "EV charger or large heat pump"
            w>=2500&&min>=20 -> "Dryer, oven or water heater"
            w in 1000..2500&&n>=10 -> "A/C or compressor cycling"
            w in 1000..2500 -> "Appliance (iron, kettle, heater)"
            w in 600..1000&&min>=60 -> "Pool pump or dehumidifier"
            else -> "Small appliance" }
          /** Always-on load: the 10th percentile of each day's load, averaged. */
          fun baselineW():Double?{
            val z=ZoneId.systemDefault()
            val v=History.pts.toList().groupBy{ Instant.ofEpochMilli(it.t).atZone(z).toLocalDate() }.values.filter{it.size>=600}
              .map{ val s=it.map{p->p.load}.sorted(); s[s.size/10].toDouble() }
            return if(v.isEmpty()) null else v.average()
          }

