                    if(tNow-lastScan>=1800000L){ lastScan=tNow; runCatching{ EventLog.scan(ctx) } }
                    if(extra){
                      fun bit(v:Long)=63-java.lang.Long.numberOfLeadingZeros(v)
                      if(x.fault!=0L){ if(x.fault!=lastFault) alert(ctx,8,"Inverter fault","Code 0x${java.lang.Long.toHexString(x.fault)} (bit ${bit(x.fault)}).") } else if(lastFault!=0L) notifier(ctx).cancel(8)
                      lastFault=x.fault
