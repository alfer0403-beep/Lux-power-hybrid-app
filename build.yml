                    if(useLocal&&tNow>=localRetryAt){
                      try{ xo=LuxClient.poll(host,dl,sn,localFails>0); via="local"; localFails=0 }
                      catch(e:Exception){ lastErr=e; localFails++; localRetryAt=tNow+(if(localFails<3) 5000L else 60000L) } }
                    // 2) otherwise the LuxPower cloud (at most every 30 s)
