          object Store{
            var d by mutableStateOf<Lux?>(null); var err by mutableStateOf(""); var runtime by mutableStateOf("\u2013")
            val series=mutableStateListOf<Lux>()
            var fc by mutableStateOf<Fc?>(null)
            var via by mutableStateOf("")
          }

          fun notifier(ctx:Context):NotificationManager=(ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).also{
            it.createNotificationChannel(NotificationChannel("monitor","Background monitoring (silent)",NotificationManager.IMPORTANCE_MIN))
            it.createNotificationChannel(NotificationChannel("live","Outage updates",NotificationManager.IMPORTANCE_LOW))
            it.createNotificationChannel(NotificationChannel("alerts","Alerts",NotificationManager.IMPORTANCE_HIGH)) }

          fun build(ctx:Context,ch:String,title:String,text:String,ongoing:Boolean=false):Notification=
            Notification.Builder(ctx,ch).setSmallIcon(if(ch=="alerts") android.R.drawable.ic_dialog_alert else android.R.drawable.ic_dialog_info)
              .setContentTitle(title).setContentText(text).setStyle(Notification.BigTextStyle().bigText(text))
              .setContentIntent(PendingIntent.getActivity(ctx,0,Intent(ctx,MainActivity::class.java),PendingIntent.FLAG_IMMUTABLE))
              .setOngoing(ongoing).setOnlyAlertOnce(true).build()

          fun post(ctx:Context,id:Int,ch:String,title:String,text:String,ongoing:Boolean=false){
            val nm=notifier(ctx); nm.notify(id,build(ctx,ch,title,text,ongoing)) }
          fun alert(ctx:Context,id:Int,title:String,text:String)=post(ctx,id,"alerts",title,text)

          fun hasLocal(p:SharedPreferences)=!p.getString("h","").isNullOrBlank()&&!p.getString("d","").isNullOrBlank()&&!p.getString("s","").isNullOrBlank()
          fun hasLuxCloud(p:SharedPreferences)=!p.getString("lcn","").isNullOrBlank()&&!p.getString("lcp","").isNullOrBlank()&&!p.getString("s","").isNullOrBlank()

          fun startMonitor(ctx:Context){
            val pf=ctx.getSharedPreferences("c",0)
            if(!(hasLocal(pf)||hasLuxCloud(pf))) return
            ctx.startForegroundService(Intent(ctx,MonitorService::class.java))
          }

          class MonitorService:Service(){
            private val scope=CoroutineScope(SupervisorJob()+Dispatchers.IO)
            private var job:Job?=null
            private var wifiLock:android.net.wifi.WifiManager.WifiLock?=null
            private var wake:android.os.PowerManager.WakeLock?=null
            override fun onBind(i:Intent?):IBinder?=null
            override fun onDestroy(){ scope.cancel(); runCatching{wifiLock?.release()}; runCatching{wake?.release()}; LuxClient.close(); super.onDestroy() }
            override fun onStartCommand(i:Intent?,f:Int,id:Int):Int{
              val sp=getSharedPreferences("c",0)
              val host=sp.getString("h","")!!.trim(); val dl=sp.getString("d","")!!.trim(); val sn=sp.getString("s","")!!.trim()
              val cap=sp.getString("c","15.36")!!.toDoubleOrNull()?:15.36; val res=sp.getString("r","10")!!.toIntOrNull()?:10
              val low=sp.getString("a","20")!!.toIntOrNull()?:20
              val interval=(sp.getString("pi","10")!!.toIntOrNull()?:10).coerceIn(10,60)
              val extra=sp.getString("xa","0")=="1"
              val useLocal=hasLocal(sp); val useLux=hasLuxCloud(sp)
              notifier(this); History.init(this); Daily.init(this); Monthly.init(this)
              if(sp.getString("wl","1")=="1"){
                if(wifiLock==null){ val wm=applicationContext.getSystemService(Context.WIFI_SERVICE) as android.net.wifi.WifiManager
                  wifiLock=wm.createWifiLock(android.net.wifi.WifiManager.WIFI_MODE_FULL_HIGH_PERF,"lux:wifi"); wifiLock?.setReferenceCounted(false); wifiLock?.acquire() }
                if(wake==null){ val pm=getSystemService(Context.POWER_SERVICE) as android.os.PowerManager
                  wake=pm.newWakeLock(android.os.PowerManager.PARTIAL_WAKE_LOCK,"lux:cpu"); wake?.setReferenceCounted(false); wake?.acquire() }
              } else { runCatching{wifiLock?.release()}; wifiLock=null; runCatching{wake?.release()}; wake=null }
