              job?.cancel()
              val ctx=this
              job=scope.launch{
                val hist=ArrayDeque<Int>(); val win=maxOf(3,300/interval); val maxS=3600/interval
                var bad=0; var good=0; var fail=0; var out=false; var lowSent=false; var lastUpd=0L
                var lastFault=0L; var lastWarn=0L; var hotSent=false; var imbSent=false; var lastFc=0L; var lastOk=0L; var localRetryAt=0L; var localFails=0; var lastLux=0L; var offlineSince=0L; var offlineSent=false; var lastScan=0L
