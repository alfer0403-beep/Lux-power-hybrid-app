            "Sunny" to Lux(100,53.6,7377,0,0,0,6465,766,pv1=2900,pv2=2500,pv3=1977,vEps=230.0),
            "Evening" to Lux(48,51.9,300,0,1900,0,0,2200,pv1=100,pv2=100,pv3=100,vEps=230.0),
            "Night" to Lux(18,50.6,0,0,0,900,0,900,vEps=230.0),
            "Charging" to Lux(35,51.4,0,3000,0,3900,0,900,vEps=230.0))
          fun demoRt(x:Lux)=if(x.charge>x.discharge+50) "Full in "+hm(15360.0*(100-x.soc)/100/x.charge)
            else hm(15360.0*maxOf(0,x.soc-10)/100*0.94/maxOf(50,x.load))

