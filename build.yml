                    if(!out&&bad>=3){ out=true; lastUpd=now; alert(ctx,2,"Grid outage",txt) }
                    else if(out&&bad>=3&&now-lastUpd>=60000){ lastUpd=now; post(ctx,2,"live","Grid outage",txt,true) }
                    if(out&&x.soc<=low&&!lowSent){ alert(ctx,4,"Battery low during outage","${x.soc}% \u00B7 about ${hm(hours)} left"); lowSent=true }
                    if(out&&good>=3){ out=false; lowSent=false; notifier(ctx).cancel(2); notifier(ctx).cancel(4); post(ctx,3,"live","Grid restored","Battery ${x.soc}% \u00B7 solar ${kw(x.pv)}") }
                    val ld=LocalDate.now(); val hourNow=java.time.LocalTime.now().hour
                    val rI=sp.getString("ri","0.25")!!.toDoubleOrNull()?:0.0; val rE=sp.getString("re","0.10")!!.toDoubleOrNull()?:0.0
                    if(sp.getString("ws","1")=="1"&&ld.dayOfWeek==java.time.DayOfWeek.SUNDAY&&hourNow>=18&&sp.getString("ws_last","")!=ld.toString()){
                      sp.edit().putString("ws_last",ld.toString()).apply()
                      val w=period(ld.minusDays(6),ld,rI,rE).s
                      post(ctx,11,"live","Weekly summary","Solar ${"%.0f".format(w[0])} kWh, exported ${"%.0f".format(w[3])}, imported ${"%.0f".format(w[2])}, net ${"%.0f".format(w[3]-w[2])} kWh") }
                    if(now-lastFc>30*60000L){ lastFc=now
                      val la=sp.getString("lat","")!!.trim(); val lo=sp.getString("lon","")!!.trim()
                      if(la.isNotEmpty()&&lo.isNotEmpty()) runCatching{fetchForecast(la,lo)}.getOrNull()?.let{ Store.fc=it } }
                    val fcn=Store.fc
                    if(sp.getString("sw","1")=="1"&&fcn!=null&&hourNow>=17&&sp.getString("sw_last","")!=ld.toString()){
